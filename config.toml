baseURL = "https://kyzn.org"
title = "kyzn"
theme = "etch"
locale = "en-US"
enableInlineShortcodes = true

[params]
  description = "Software Engineer | Looking for Security Engineer roles in Japan"
  copyright = "<center><a href=\"/\">© {year} Kivanc Yazan</a> · <a href=\"https://creativecommons.org/licenses/by/4.0/\" target=\"_blank\">CC BY 4.0</a></center>"
  dark = "auto"
  highlight = true

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "posts"
    title = "posts"
    url = "/"
    weight = 10

  [[menu.main]]
    identifier = "slides"
    name = "slides"
    title = "slides"
    url = "/slides/"
    weight = 20

[permalinks]
  posts = "/:title/"

[markup.goldmark.renderer]
  # Allow HTML in Markdown
  unsafe = true

[markup.highlight]
  codeFences = true
  noClasses = false

[markup.tableOfContents]
  ordered = true
